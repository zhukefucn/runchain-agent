[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentscope-multitenant-demo"
version = "0.1.0"
description = "Windows-native multi-tenant AgentScope demo"
requires-python = ">=3.11,<3.14"
dependencies = [
    "SQLAlchemy==2.0.44",
    "aiosqlite==0.21.0",
    "argon2-cffi==25.1.0",
    "fastapi==0.139.0",
    "PyJWT==2.13.0",
    "pydantic-settings==2.10.1",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==8.4.2",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.setuptools.packages.find]
where = ["backend"]
